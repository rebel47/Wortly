name: wortly
description: A small daily habit for a bigger German vocabulary. Fully offline.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.2
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
flutter:
  uses-material-design: true
  assets:
    - assets/content/vocabulary.json
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
